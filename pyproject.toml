[project]
name = "gekai"
version = "0.3.0a2"
description = "Precision-scoped AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "openai>=1.50",
    "python-toon",
    "textual>=0.70",
    "tree-sitter>=0.25",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "pathspec>=0.12",
    "sqlite-vec",
    "fastembed",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

[project.scripts]
gekai = "agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: marks tests that make real LLM calls (deselected by default, run with --llm)",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
