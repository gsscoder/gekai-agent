[project]
name = "gekai"
version = "0.1.0a1"
description = "Precision-scoped AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "llmstitch[openai]",
    "python-dotenv>=1.0",
    "pyfiglet>=1.0",
    "python-toon",
    "textual>=0.70",
]

[project.scripts]
gekai = "agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
