[project]
name = "gekai"
version = "0.1.0a1"
description = "Precision-scoped AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "llmstitch[openai]",
    "python-dotenv>=1.0",
    "pyfiglet>=1.0",
    "python-toon",
]

[project.scripts]
gekai = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
