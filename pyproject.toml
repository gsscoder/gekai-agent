[project]
name = "gekai"
version = "0.3.0a1"
description = "Precision-scoped AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyfiglet>=1.0",
    "python-toon",
    "textual>=0.70",
    "tree-sitter>=0.25",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
]

[project.scripts]
gekai = "agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
